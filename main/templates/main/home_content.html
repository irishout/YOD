<!-- Home content for HTMX requests -->
<main class="px-6 py-24 text-center">

    <h2 class="text-4xl sm:text-6xl mb-6 leading-tight">
        YEARS OF DAMAGE
    </h2>

    <p class="text-sm text-gray-600 max-w-xl mx-auto leading-relaxed">
        ода всем жизненным трудностям и невзгодам, <br>
        которые встречаются на нашем пути 
    </p>

    <div class="mt-16 grid grid-cols-1 md:grid-cols-2 gap-10 max-w-2xl mx-auto">
        {% for category in categories %}
        <a href="{% url 'main:catalog' category.slug %}" 
           hx-get="{% url 'main:catalog' category.slug %}" 
           hx-target="#main-content" 
           hx-push-url="true"
           class="border border-black/20 p-10 hover:border-black transition">
            <h3 class="text-lg">{{ category.name|upper }}</h3>
        </a>
        {% endfor %}
    </div>

</main>
